name: Auto Sync Fork

on:
  schedule:
    # 每天北京时间早上 8 点自动执行
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动点击触发

# 在全局配置环境变量，强制让 Actions 提前启用 Node.js 24 运行环境
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 1. 升级到支持新环境的 checkout（这里依然保留 v4，通过环境变量强制其运行在 Node 24 上）
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. 配置 Git 身份信息
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # 3. 添加上游源仓库，拉取并合并
      - name: Sync from Upstream
        run: |
          git remote add upstream https://github.com/electkismet/eltdx.git
          git fetch upstream
          git checkout main
          git merge upstream/main --ff-only || git merge upstream/main -m "Merge upstream changes"
          git push origin main
